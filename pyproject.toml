[project]
name = "RepoTokenDiminution"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swapnil G", email = "sgaicommunity@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ast-grep-py>=0.51.1",
    "litellm>=1.108.2",
    "networkx>=3.7",
    "pathspec>=1.1.1",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
    "tree-sitter-language-pack>=1.25.0",
    "typer>=0.28.0",
]

[project.scripts]
repopilot = "repopilot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
